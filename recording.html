<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформлення замовлення - Друзі Тварин</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <img src="logo.png.png" alt="Логотип">
            <a href="index.html">Друзі Тварин</a>
        </div>
        <nav class="navigation">
            <ul>
                <li><a href="#">Місто</a></li>
                <li><a href="#">Особистий кабінет</a></li>
                <li><a href="about.html">Про нас</a></li>
                <li><a href="#">Новини</a></li>
                <li><a href="contacts.html">Контакти</a></li>
                <li><a href="#">Блог</a></li>
            </ul>
        </nav>
        <div class="konotop">
            <img src="location.jpg" alt="Локація">
            <a href="#">МІСТО</a>
        </div>
    </header>

    <main class="recording-container">
        <section class="order-form">
            <a href="index.html" class="back-link">&lt; НАЗАД</a>
            <h1>Оформлення замовлення</h1>
            
            <form action="#" method="POST">
                <label for="name">ПІП</label>
                <input type="text" id="name" name="name" placeholder="Ваше ім'я" required>
                
                <label for="phone">Номер телефону</label>
                <input type="tel" id="phone" name="phone" placeholder="+38 (097) 999 99 99" required>
                
                <label for="date">Бажана дата та час</label>
                <input type="datetime-local" id="date" name="date" required>
                
                <label for="problem">Опис проблеми</label>
                <textarea id="problem" name="problem" placeholder="Коротко опишіть проблему"></textarea>
                
                <button type="submit">Записатись</button>
            </form>
        </section>
    </main>

    <footer>
        <ul class="socials-list">
            <li><a href="#"><img src="instagram-icon.jpe" alt="Instagram"></a></li>
            <li><a href="#"><img src="telegram-icon.png.jpe" alt="Telegram"></a></li>
            <li><a href="#"><img src="youtube-icon.png.jpe" alt="YouTube"></a></li>
            <li><a href="#"><img src="facebook-icon.png.jpe" alt="Facebook"></a></li>
        </ul>
    </footer>
<script src="script/script.js"></script>
</body>
</html>
